# Intégration continue : chaque push (sur n'importe quelle branche) et chaque
# pull request déclenche automatiquement les tests TDD puis les scénarios BDD.
# Un pipeline rouge se voit sur le commit, le badge et la pull request : on ne fusionne pas.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:   # bouton « Run workflow » pour relancer à la main

jobs:
  tests:
    name: "Tests TDD + scénarios BDD (connexion GitHub)"
    # Version figée plutôt que « ubuntu-latest », qui change d'Ubuntu sans prévenir :
    # le pipeline reste reproductible.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Pas d'étape « playwright install » : elle restait bloquée 10 minutes sur le
      # téléchargement. Les scénarios utilisent le Google Chrome préinstallé sur la machine.
      - name: Tests unitaires (TDD) puis scénarios Gherkin (BDD) dans Google Chrome
        run: mvn -B verify -Dcanal=chrome
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          # Secrets du dépôt (Settings > Secrets and variables > Actions).
          # Absents : le scénario @compte-reel est ignoré, les autres s'exécutent.
          GH_LOGIN: ${{ secrets.GH_LOGIN }}
          GH_PASSWORD: ${{ secrets.GH_PASSWORD }}
          GH_TOTP_SECRET: ${{ secrets.GH_TOTP_SECRET }}

      - name: Publier les rapports (même en cas d'échec)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rapports-tests
          path: |
            target/cucumber-reports/
            target/surefire-reports/
